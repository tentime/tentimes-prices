name: Refresh prices and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    outputs:
      refresh_outcome: ${{ steps.refresh.outcome }}
    steps:
      - name: Check out site and saved price history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check collectors and graph logic
        run: npm test
      - name: Collect current public-source prices
        id: refresh
        continue-on-error: true
        run: npm run refresh
      - name: Preserve updated quotes in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update recorded prices'
            git push origin HEAD:main
          fi
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  report-source-failure:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.refresh_outcome == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark failed collection for review
        run: |
          echo '::error::A pricing source failed. Valid saved quotes were retained; inspect the collection log and source footnote.'
          exit 1
